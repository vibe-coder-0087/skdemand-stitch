<script>
  (function () {
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playPauseIcon = document.getElementById('playPauseIcon');
    let isPlaying = true;

    if (playPauseBtn && playPauseIcon) {
      playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
        playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause audio' : 'Play audio');
      });
    }

    const likeBtn = document.getElementById('likeBtn');
    const likeIcon = document.getElementById('likeIcon');
    let isLiked = true;

    if (likeBtn && likeIcon) {
      likeBtn.addEventListener('click', () => {
        isLiked = !isLiked;
        likeIcon.style.fontVariationSettings = isLiked ? "'FILL' 1" : "'FILL' 0";
        likeBtn.className = isLiked 
          ? "w-11 h-11 rounded-full flex items-center justify-center text-primary hover:text-primary-fixed transition-transform active:scale-75"
          : "w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-transform active:scale-75";
      });
    }

    const scrubberTrack = document.getElementById('scrubberTrack');
    const progressBar = document.getElementById('progressBar');
    const progressThumb = document.getElementById('progressThumb');
    const elapsedTime = document.getElementById('elapsedTime');

    if (scrubberTrack && progressBar && progressThumb && elapsedTime) {
      const updatePosition = (clientX) => {
        const rect = scrubberTrack.getBoundingClientRect();
        const clampedX = Math.max(0, Math.min(clientX - rect.left, rect.width));
        const percentage = (clampedX / rect.width) * 100;
        progressBar.style.width = percentage + '%';
        progressThumb.style.left = percentage + '%';

        const totalSeconds = 255;
        const currentSeconds = Math.round((percentage / 100) * totalSeconds);
        const mins = Math.floor(currentSeconds / 60);
        const secs = String(currentSeconds % 60).padStart(2, '0');
        elapsedTime.textContent = mins + ':' + secs;
      };

      scrubberTrack.addEventListener('click', (e) => {
        updatePosition(e.clientX);
      });
    }
  })();
