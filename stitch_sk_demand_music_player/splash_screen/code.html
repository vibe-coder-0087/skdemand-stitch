<script>
  (function() {
    // Dynamic Equalizer Frequency Wave Emulation
    const eqBars = document.querySelectorAll('#equalizer-bars > div');
    const updateEqualizer = () => {
      eqBars.forEach((bar) => {
        const rand = Math.floor(Math.random() * 85) + 15;
        bar.style.height = `${rand}%`;
      });
    };
    const eqInterval = setInterval(updateEqualizer, 180);

    // Progressive Boot State Feedback
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('pipeline-status');
    const steps = [
      { progress: '38%', text: 'Tuning Studio Master Buffer...' },
      { progress: '64%', text: 'Calibrating Spatial Headstage...' },
      { progress: '88%', text: 'Synchronizing Acoustic Identity...' },
      { progress: '100%', text: 'Session Primed • Uncompressed' }
    ];

    let currentStep = 0;
    const progressInterval = setInterval(() => {
      if (currentStep < steps.length) {
        if (progressBar) progressBar.style.width = steps[currentStep].progress;
        if (statusText) statusText.textContent = steps[currentStep].text;
        currentStep++;
      } else {
        clearInterval(progressInterval);
      }
    }, 900);
  })();
